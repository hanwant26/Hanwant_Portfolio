<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Hanwant Portfolio
    </title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <a href="{{ url_for('home') }}"
           class="admin-logo">

            Hanwant<span>.</span>

        </a>


        <p class="admin-label">
            Portfolio Administration
        </p>


        <h1>
            Admin Login
        </h1>


        <p class="login-description">

            Sign in to manage contact messages
            received through your portfolio.

        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST"
              class="login-form">


            <div class="form-group">

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required>

            </div>


            <button type="submit"
                    class="login-button">

                Login

            </button>


        </form>


        <a href="{{ url_for('home') }}"
           class="back-link">

            ← Back to Portfolio

        </a>


    </div>


</div>


</body>

</html>
